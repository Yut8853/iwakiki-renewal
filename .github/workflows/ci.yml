name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend (Astro)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install
        run: pnpm install
        working-directory: ./frontend

      - name: Type Check
        run: pnpm run astro check
        working-directory: ./frontend

      - name: Build
        run: pnpm build
        working-directory: ./frontend

  cms:
    name: CMS (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'cms/pnpm-lock.yaml'

      - name: Install
        run: pnpm install
        working-directory: ./cms

      - name: Build
        run: pnpm build
        working-directory: ./cms
