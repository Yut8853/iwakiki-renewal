name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install (frontend)
        run: pnpm install
        working-directory: frontend

      - name: Build (frontend)
        run: pnpm build
        working-directory: frontend

      - name: Install (cms)
        run: pnpm install
        working-directory: cms

      - name: Build (cms)
        run: pnpm build
        working-directory: cms